<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tafelapp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">Hulp: tafel van ...</div>
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col">
                                <label for="inputHulp" class="col-form-label">Welke tafel?</label>
                            </div>
                            <div class="col">
                                <input type="number" id="inputHulp" class="form-control">
                            </div>
                            <div class="col">
                                <a href="#" class="btn btn-success" onclick="toonHulp()">GO!</a>
                            </div>
                        </div>
                        <p class="card-text mt-3" id="outputHulp"></p>
                    </div>
                    <div class="card-footer text-body-secondary">Made by Ali Alobeid</div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">Puzzel: tafel van ...</div>
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col">
                                <label for="inputPuzzel" class="col-form-label">Welke tafel?</label>
                            </div>
                            <div class="col">
                                <input type="number" id="inputPuzzel" class="form-control">
                            </div>
                            <div class="col">
                                <a href="#" class="btn btn-success" onclick="maakPuzzel()">GO!</a>
                            </div>
                        </div>

                        <div id="outputPuzzel" class="mt-3"></div>
                        <button id="checkKnop" class="btn btn-primary mt-2 d-none"
                            onclick="controleer()">Controleer</button>
                        <p class="mt-3 fw-bold" id="resultaat"></p>
                    </div>
                    <div class="card-footer text-body-secondary">Made by Ali Alobeid</div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="tafelapp.js"></script>
</body>

</html>
